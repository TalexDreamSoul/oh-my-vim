name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test core + fidelity + levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Core unit tests
        run: pnpm -C packages/core test

      - name: Core typecheck
        run: pnpm -C packages/core typecheck

      - name: Level solvability (solution -> replay -> win assertions)
        run: pnpm check:levels

      - name: Fidelity cases vs vim -u NONE
        run: pnpm fidelity

      - name: Build web
        run: pnpm -C packages/web build

  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.repository == 'TalexDreamSoul/oh-my-vim'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm -C packages/web build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy packages/web/.output/public --project-name=oh-my-vim
